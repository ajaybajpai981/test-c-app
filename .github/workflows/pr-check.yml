name: PR Check & Build

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build & Verify (1-Tick Verification)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository with Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Compiler Build Tools
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Compile Application with Submodule
        run: |
          gcc -Wall -Wextra -I. hello.c submodules/math_utils/math_utils.c -o hello
          chmod +x hello

      - name: Run Executable & Verify
        run: |
          ./hello
